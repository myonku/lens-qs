name: backend
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: lens_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./... -count=1
        env:
          LENS_TEST_POSTGRES_DSN: postgres://postgres:disposable-ci-password@localhost:5432/lens_test?sslmode=disable
          LENS_TEST_PG_DOCKER_CONTAINER: ${{ job.services.postgres.id }}
